[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "v4-shortform-script-foundry"
version = "0.0.0"
description = "Clean-room skeleton for a Renderer Router based shortform script core"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
