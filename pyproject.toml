[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "v4-shortform-script-foundry"
version = "0.1.0"
description = "Deterministic pre-writer core for Renderer Router based shortform scripts"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
